<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="el_Fuszka">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>el_Fuszka</title>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --primary:#1d4ed8; --primary-weak:#e6edff; --on-primary:#ffffff;
  --danger:#dc2626; --danger-weak:#fdecec; --warn-weak:#fff6e0; --warn:#a16207;
  --s-wycena:#64748b; --s-w_trakcie:#d97706; --s-zakonczony:#16a34a; --s-rozliczony:#7c3aed;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:14px; --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1116; --card:#181c24; --text:#e8eaf0; --muted:#9aa2b1; --line:#2a303c;
    --primary:#6b93f5; --primary-weak:#1c2740; --on-primary:#0b1020;
    --danger:#f87171; --danger-weak:#3a1d1d; --warn-weak:#3a2f12; --warn:#facc15;
    --shadow:none; color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 88px)}
body.noscroll{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text)}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding-top:env(safe-area-inset-top)}
.topbar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:4px;min-height:56px;padding:0 6px 0 12px}
.topbar h1{flex:1;font-size:20px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar.has-back .topbar-in{padding-left:4px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:active{background:var(--line)}
.icon-btn svg{width:24px;height:24px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:640px;margin:0 auto;display:flex;height:var(--tabbar-h)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted);font-weight:600}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--primary)}
.tab.on .tab-ic{background:var(--primary-weak)}
.tab-ic{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center}

/* FAB */
.fab{position:fixed;z-index:25;right:16px;bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 16px);
  background:var(--primary);color:var(--on-primary);height:56px;padding:0 20px 0 16px;border-radius:18px;
  display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:0 6px 16px rgba(29,78,216,.35)}
.fab svg{width:24px;height:24px}
.fab[hidden]{display:none}
@media (min-width:672px){.fab{right:calc(50% - 320px + 16px)}}

/* Cards & common */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.card-pad{padding:14px 16px}
.muted{color:var(--muted)}
.small{font-size:14px}
h3{font-size:16px;margin:0}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-weak);color:var(--text);border-radius:var(--radius);padding:12px 14px;margin:0 0 12px;font-size:15px}
.banner b{color:var(--warn)}
.search{position:relative;margin:4px 0 10px}
.search input{width:100%;height:48px;border-radius:24px;border:1px solid var(--line);background:var(--card);padding:0 16px 0 44px;font-size:16px;outline:none}
.search input:focus{border-color:var(--primary)}
.search svg{position:absolute;left:14px;top:12px;width:22px;height:22px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.chip .cnt{font-weight:500;opacity:.7}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.5}
.empty p{margin:8px 0 0}

/* Project cards */
.pcard{display:block;padding:14px 16px}
.pcard:active{background:var(--line)}
.pc-top{display:flex;gap:12px;align-items:baseline}
.pc-name{flex:1;font-weight:700;font-size:17px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc-sum{font-weight:700;white-space:nowrap}
.pc-sub{color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-bot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--sc)}
.badge::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--sc)}
.s-wycena{--sc:var(--s-wycena)} .s-w_trakcie{--sc:var(--s-w_trakcie)} .s-zakonczony{--sc:var(--s-zakonczony)} .s-rozliczony{--sc:var(--s-rozliczony)}

/* Project detail */
.irow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.irow svg{width:22px;height:22px;color:var(--primary);flex:none}
.irow .grow{flex:1;min-width:0;overflow-wrap:anywhere}
a.irow:active{background:var(--line)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:12px}
.seg button{min-height:40px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;font-weight:600;padding:2px;line-height:1.15}
.seg button.on{background:var(--sc);border-color:var(--sc);color:#fff}
.summary .sum-row{display:flex;justify-content:space-between;padding:6px 16px;font-size:15px}
.summary .sum-row:first-child{padding-top:14px}
.summary .sum-total{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px 14px;margin-top:6px;border-top:1px solid var(--line)}
.sum-total span{font-weight:600}
.sum-total b{font-size:24px;color:var(--primary)}
.sec-head{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 10px 16px;border-bottom:1px solid var(--line)}
.btn-add{height:40px;padding:0 12px;border-radius:10px;color:var(--primary);font-weight:700;display:inline-flex;align-items:center;gap:4px}
.btn-add:active{background:var(--primary-weak)}
.btn-add svg{width:20px;height:20px}
.row{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:56px}
.row:active{background:var(--line)}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;overflow-wrap:anywhere}
.row-sub{color:var(--muted);font-size:14px}
.row-amt{font-weight:700;white-space:nowrap}
.sec-sum{display:flex;justify-content:space-between;padding:12px 16px;font-weight:600;background:var(--primary-weak)}
.empty-sm{padding:14px 16px;color:var(--muted);font-size:14px;border-bottom:1px solid var(--line)}
.notes textarea{width:100%;border:0;background:transparent;resize:vertical;min-height:96px;padding:12px 16px;outline:none;font-size:16px}

/* Forms */
.field{margin:0 0 14px}
.field label,.flabel{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:0 0 6px}
.inp{width:100%;height:50px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;font-size:17px;outline:none}
textarea.inp{height:auto;min-height:80px;padding:12px 14px;resize:vertical}
.inp:focus{border-color:var(--primary);background:var(--card)}
.inp.err{border-color:var(--danger);background:var(--danger-weak)}
.suffix{position:relative}
.suffix .inp{padding-right:64px}
.suffix span{position:absolute;right:14px;top:14px;color:var(--muted);font-size:15px;pointer-events:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;gap:8px}
.stepper .inp{text-align:center;font-weight:700}
.stepper button{width:56px;height:50px;flex:none;border-radius:12px;background:var(--primary-weak);color:var(--primary);font-size:26px;font-weight:700}
.quick{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.quick button{height:36px;min-width:52px;padding:0 10px;border-radius:18px;border:1px solid var(--line);font-weight:600;font-size:14px}
.quick button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.check{display:flex;align-items:center;gap:12px;min-height:48px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--primary)}
.total-box{display:flex;justify-content:space-between;align-items:baseline;background:var(--primary-weak);border-radius:12px;padding:12px 14px;margin-top:4px}
.total-box b{font-size:22px;color:var(--primary)}
.total-box small{display:block;color:var(--muted);font-size:13px}
.sugg{border:1px solid var(--line);border-radius:12px;margin-top:8px;max-height:220px;overflow-y:auto}
.sugg button{display:flex;width:100%;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
.sugg button:last-child{border-bottom:0}
.sugg button:active,.sugg button.on{background:var(--primary-weak)}
.sugg .sg-name{flex:1;min-width:0;overflow-wrap:anywhere}
.sugg .sg-price{font-weight:600;white-space:nowrap}
.sugg .sg-stock{display:block;color:var(--muted);font-size:13px;font-weight:400}
.sugg-empty{padding:12px 14px;color:var(--muted);font-size:14px}

.btn{height:50px;padding:0 20px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.ghost{border:1px solid var(--line)}
.btn.danger{background:var(--danger);color:#fff}
.btn.danger-ghost{color:var(--danger);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:active{filter:brightness(.92)}
.menu-list button{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 4px;border-bottom:1px solid var(--line);font-weight:600;text-align:left}
.menu-list button:last-child{border-bottom:0}
.menu-list svg{width:24px;height:24px;color:var(--primary);flex:none}
.menu-list .danger,.menu-list .danger svg{color:var(--danger)}
.menu-list small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.choose{display:grid;gap:10px}
.choose button{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);text-align:left}
.choose button:active{background:var(--primary-weak)}
.choose .ci{width:48px;height:48px;border-radius:12px;background:var(--primary-weak);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.choose .ci svg{width:26px;height:26px}
.choose b{display:block;font-size:17px}
.choose small{color:var(--muted);font-size:14px}

/* Kalkulatory */
.choose a{display:flex;align-items:center;gap:14px;padding:14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.choose a:active{background:var(--primary-weak)}
.choose a .grow{flex:1;min-width:0}
.choose a > svg{width:20px;height:20px;color:var(--muted);flex:none}
.segp{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.segp button{min-height:44px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-weight:600;padding:2px 4px;line-height:1.15}
.segp button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.segp button small{display:block;font-size:11px;font-weight:500;opacity:.8}
.inp.calc-out{background:var(--primary-weak);border-color:transparent;color:var(--primary);font-weight:700}
.lbl-tag{font-weight:500;font-size:12px;color:var(--primary);margin-left:4px}
.formula{letter-spacing:.01em}
.formula .f-main{font-size:17px;font-weight:700;padding:2px 0}
.formula .hint{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.res-head{padding:14px 16px 6px;font-weight:700;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.res-big{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:6px 16px 4px}
.res-big b{font-size:30px;line-height:1.1}
.res-big.ok b{color:var(--s-zakonczony)} .res-big.bad b{color:var(--danger)}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:4px 10px;border-radius:12px}
.pill.ok{background:color-mix(in srgb,var(--s-zakonczony) 16%,transparent);color:var(--s-zakonczony)}
.pill.bad{background:var(--danger-weak);color:var(--danger)}
.recom{margin:0 12px 12px;padding:12px 14px;border-radius:12px;background:var(--primary-weak);display:flex;align-items:center;gap:12px}
.recom .grow{flex:1;min-width:0;font-size:15px}
.recom .btn{height:40px;padding:0 14px}
details.card summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:20px;line-height:1;color:var(--muted)}
details.card[open] summary::after{content:"−"}
.fx{padding:0 16px 14px;font-size:14px;line-height:1.6}
.fx code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;background:var(--bg);padding:1px 6px;border-radius:6px}
select.inp{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat}

.sep-list{display:grid;gap:10px;margin-top:4px}
.sep-card{display:flex;gap:14px;align-items:flex-start;width:100%;padding:14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);text-align:left}
.sep-card:active{background:var(--primary-weak)}
.sep-card .ci{width:48px;height:48px;border-radius:12px;background:var(--primary-weak);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none}
.sep-card .ci svg{width:26px;height:26px}
.sep-card .grow{flex:1;min-width:0}
.sep-card b{display:block;font-size:17px;overflow-wrap:anywhere}
.sep-card .sep-desc{display:block;margin-top:2px;font-size:15px;color:var(--text);white-space:pre-line;overflow-wrap:anywhere}

/* Sheet */
#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet-root .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s}
#sheet-root .sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;background:var(--card);
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s ease-out;
  padding-bottom:env(safe-area-inset-bottom)}
#sheet-root.open{pointer-events:auto}
#sheet-root.open .backdrop{opacity:1}
#sheet-root.open .sheet{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;padding:4px 6px 4px 18px}
.sheet-head h2{flex:1;font-size:19px;margin:0}
.sheet-body{overflow-y:auto;padding:8px 18px 12px;flex:1;-webkit-overflow-scrolling:touch}
.sheet-foot{display:flex;gap:10px;padding:10px 18px 14px;border-top:1px solid var(--line)}
.sheet-foot .primary{flex:1}
.sheet-foot:empty{display:none}

/* Dialog & toast */
.dlg-back{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:var(--card);border-radius:18px;padding:20px;max-width:400px;width:100%}
.dlg p{margin:0 0 18px;font-size:16px;white-space:pre-line}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end}
.dlg-btns .btn{flex:1}
.dlg-col{display:grid;gap:10px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-20px);
  background:#111827;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:80;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.set-row{padding:14px 16px;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.btns{display:grid;gap:10px;padding:0 16px 16px}
.sec-title{font-size:14px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:18px 4px 8px}
</style>
</head>
<body>
<header class="topbar" id="topbar"></header>
<main class="wrap" id="view"></main>
<button class="fab" id="fab" hidden></button>
<nav class="tabbar">
  <div class="tabbar-in">
    <a class="tab" data-tab="projects" href="#/projects"><span class="tab-ic" data-ic="folder"></span>Projekty</a>
    <a class="tab" data-tab="quotes" href="#/quotes"><span class="tab-ic" data-ic="doc"></span>Wyceny</a>
    <a class="tab" data-tab="catalog" href="#/catalog"><span class="tab-ic" data-ic="box"></span>Katalog</a>
    <a class="tab" data-tab="calc" href="#/calc"><span class="tab-ic" data-ic="tool"></span>Narzędzia</a>
  </div>
</nav>
<div id="sheet-root"></div>
<div id="dialog-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ================= Stałe i dane ================= */
const APP_VERSION = '1.5.0';
const KEY = 'wyceny.data.v1';
const STATUSES = [
  {k:'wycena', l:'Wycena'},
  {k:'w_trakcie', l:'W trakcie'},
  {k:'zakonczony', l:'Zakończony'},
  {k:'rozliczony', l:'Rozliczony'}
];
const TYPES = {
  travel:{one:'Przyjazd', many:'Przyjazdy'},
  labor:{one:'Robocizna', many:'Robocizna'},
  part:{one:'Część', many:'Części'}
};

const ICONS = {
  folder:'<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2h8.4A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>',
  box:'<path d="M3.5 7.5 12 3l8.5 4.5v9L12 21l-8.5-4.5z"/><path d="M3.5 7.5 12 12l8.5-4.5M12 12v9"/>',

function defaults(){
  return {version:1, settings:{kmRate:0, hourRate:0, configured:false}, catalog:[], projects:[], sep:[], quotes:[],
    company:{name:'', person:'', nip:'', address:'', phone:'', email:'', bank:'', notes:''}, meta:{lastBackup:null}};
}
function normalize(d){
  const b = defaults();
  if(!d || typeof d !== 'object') return b;
  return {
    version:1,
    settings:{...b.settings, ...(d.settings||{})},
    meta:{...b.meta, ...(d.meta||{})},
    catalog:Array.isArray(d.catalog) ? d.catalog.filter(c=>c && c.name).map(c=>({...c, stock: toStock(c.stock) ?? 0})) : [],
    sep:Array.isArray(d.sep) ? d.sep.filter(x=>x && x.title) : [],
    company:{...b.company, ...(d.company||{})},
    quotes:Array.isArray(d.quotes) ? d.quotes.filter(x=>x && x.id).map(x=>({
      number:'', date:todayISO(), subject:'', notes:'', projectId:null, ...x,
      client:{name:'', address:'', phone:'', ...(x.client||{})},
      items:Array.isArray(x.items) ? x.items : []
    })) : [],
    projects:Array.isArray(d.projects) ? d.projects.filter(p=>p && p.id).map(p=>({
      status:'wycena', notes:'', address:'', phone:'', distance:null, ...p,
      items:Array.isArray(p.items) ? p.items : []
    })) : []
  };
}
function load(){
  try{ const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : defaults(); }
  catch(e){ console.error(e); return defaults(); }
}
let db = load();
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ console.error(e); toast('Błąd zapisu danych!'); }
}

/* ================= Pomocnicze ================= */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const r2 = n => Math.round(((Number(n)||0) + Number.EPSILON) * 100) / 100;
const moneyF = new Intl.NumberFormat('pl-PL', {style:'currency', currency:'PLN'});
const numF = new Intl.NumberFormat('pl-PL', {maximumFractionDigits:2});
const fm = n => moneyF.format(r2(n));
const fn = n => numF.format(Number(n)||0);
const inVal = n => (n===null || n===undefined || n==='') ? '' : String(r2(n)).replace('.', ',');
function parseNum(v){
  if(v===null || v===undefined) return null;
  const s = String(v).replace(/\s/g,'').replace(',', '.');
  if(s==='') return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
/* Stan magazynowy – liczba całkowita >= 0 (undefined = brak wartości) */
function toStock(v){
  const s = String(v ?? '').replace(/szt\.?/gi,'').replace(/\s/g,'');
  if(s==='') return undefined;
  const n = parseNum(s);
  return (n===null || n<0) ? undefined : Math.round(n);
}
function todayISO(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return `${d}.${m}.${y}`; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
const statusLabel = k => (STATUSES.find(s=>s.k===k) || STATUSES[0]).l;
const getProject = id => db.projects.find(p=>p.id===id);
const touch = p => { p.updatedAt = new Date().toISOString(); };

function itemTotal(it){
  switch(it.type){
    case 'travel': return r2((Number(it.km)||0) * (it.roundTrip===false ? 1 : 2) * (Number(it.rate)||0));
    case 'labor':  return r2((Number(it.hours)||0) * (Number(it.rate)||0));
    case 'part':   return r2((Number(it.price)||0) * (Number(it.qty)||0));
  }
  return 0;
}
function projectTotals(p){
  const t = {travel:0, labor:0, part:0};
  p.items.forEach(it => { if(t[it.type]!==undefined) t[it.type] = r2(t[it.type] + itemTotal(it)); });
  t.all = r2(t.travel + t.labor + t.part);
  return t;
}

let toastT;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove('show'), 2200);
}

function confirmDlg(msg, okLabel='Usuń', danger=true){
  return new Promise(res => {
    const root = $('#dialog-root');
    root.innerHTML = `<div class="dlg-back"><div class="dlg" role="alertdialog"><p>${esc(msg)}</p>
      <div class="dlg-btns"><button class="btn ghost" data-r="0">Anuluj</button>
      <button class="btn ${danger?'danger':'primary'}" data-r="1">${esc(okLabel)}</button></div></div></div>`;
    root.onclick = e => {
      const b = e.target.closest('[data-r]');
      if(!b && e.target.classList.contains('dlg-back')){ root.innerHTML=''; res(false); return; }
      if(b){ root.innerHTML=''; res(b.dataset.r==='1'); }
    };
  });
}

/* ================= Arkusz (bottom sheet) ================= */
const sheetRoot = $('#sheet-root');
let sheetOpen = false, sheetCloseRes = null, sheetTok = 0;

function openSheet(title, body, opts={}){
  sheetTok++;
  sheetRoot.innerHTML = `<div class="backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="grab"></div>
      <div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="icon-btn" data-close aria-label="Zamknij">${ic('close')}</button></div>
      <form class="sheet-body" novalidate autocomplete="off">${body}<button type="submit" hidden></button></form>
      <div class="sheet-foot">${opts.onDelete ? `<button type="button" class="btn danger-ghost" data-del>${ic('trash')}Usuń</button>` : ''}${opts.onSave ? `<button type="button" class="btn primary" data-save>${esc(opts.saveLabel||'Zapisz')}</button>` : ''}</div>
    </div>`;
  if(!sheetOpen){ history.pushState({sheet:true}, ''); sheetOpen = true; }
  document.body.classList.add('noscroll');
  requestAnimationFrame(()=>requestAnimationFrame(()=>sheetRoot.classList.add('open')));
  const el = $('.sheet', sheetRoot), form = $('form', el);
  $('.backdrop', sheetRoot).onclick = () => closeSheet();
  $('[data-close]', el).onclick = () => closeSheet();
  const doSave = async () => {
    if(!opts.onSave) return;
    const res = await opts.onSave(form);
    if(res === false) return;
    await closeSheet();
    if(typeof res === 'function') res(); else render();
  };
  form.onsubmit = e => { e.preventDefault(); doSave(); };
  const sb = $('[data-save]', el); if(sb) sb.onclick = doSave;
  const db_ = $('[data-del]', el);
  if(db_) db_.onclick = async () => {
    const res = await opts.onDelete(form);
    if(res === false) return;
    await closeSheet();
    if(typeof res === 'function') res(); else render();
  };
  if(opts.onMount) opts.onMount(form);
  return form;
}
function hideSheet(){
  sheetOpen = false;
  sheetRoot.classList.remove('open');
  document.body.classList.remove('noscroll');
  const tok = ++sheetTok;
  setTimeout(()=>{ if(tok===sheetTok && !sheetOpen) sheetRoot.innerHTML=''; }, 260);
}
function closeSheet(){
  return new Promise(res => {
    if(!sheetOpen){ res(); return; }
    sheetCloseRes = res;
    history.back();
  });
}
window.addEventListener('popstate', () => {
  if(sheetOpen){
    hideSheet();
    if(sheetCloseRes){ const r = sheetCloseRes; sheetCloseRes = null; setTimeout(r, 0); }
  }
});

/* Pola formularza */
function fieldNum(name, label, value, unit, opts={}){
  return `<div class="field"><label for="f-${name}">${label}</label>
    <div class="suffix"><input class="inp" id="f-${name}" name="${name}" inputmode="decimal" value="${esc(inVal(value))}" placeholder="${opts.ph||'0'}"><span>${unit}</span></div>
    ${opts.hint?`<div class="hint">${opts.hint}</div>`:''}</div>`;
}
function fieldStepper(name, label, value, step, quick=[], unit=''){
  return `<div class="field"><label for="f-${name}">${label}</label>
    <div class="stepper"><button type="button" data-step="-${step}" aria-label="Mniej">−</button>
    <input class="inp" id="f-${name}" name="${name}" inputmode="decimal" value="${esc(inVal(value))}">
    <button type="button" data-step="${step}" aria-label="Więcej">+</button></div>
    ${quick.length?`<div class="quick" data-quick="${name}">${quick.map(q=>`<button type="button" data-q="${q}">${fn(q)}${unit}</button>`).join('')}</div>`:''}</div>`;
}
function bindSteppers(form, onChange){
  form.addEventListener('click', e => {
    const b = e.target.closest('[data-step]');
    if(b){
      const inp = $('input', b.parentElement);
      const step = Number(b.dataset.step);
      let v = r2((parseNum(inp.value) || 0) + step);
      if(v < 0) v = 0;
      inp.value = inVal(v); onChange && onChange(); return;
    }
    const q = e.target.closest('[data-q]');
    if(q){
      const name = q.parentElement.dataset.quick;
      form.elements[name].value = inVal(Number(q.dataset.q)); onChange && onChange();
    }
  });
  form.addEventListener('input', () => onChange && onChange());
}
function markErr(form, name, msg){
  const el = form.elements[name]; if(el){ el.classList.add('err'); el.focus(); el.addEventListener('input', ()=>el.classList.remove('err'), {once:true}); }
  toast(msg); return false;
}
function syncQuick(form, name){
  const v = parseNum(form.elements[name].value);
  $$(`[data-quick="${name}"] [data-q]`, form).forEach(b => b.classList.toggle('on', Number(b.dataset.q)===v));
}

/* ================= Nawigacja ================= */
const view = $('#view'), topbar = $('#topbar'), fab = $('#fab');
let prevRoute = null, lastTab = 'projects';
const ui = {q:'', status:'all', catQ:'', catF:'all'};

function parseRoute(){
  const h = (location.hash || '#/projects').replace(/^#\/?/, '');
  const [name, id] = h.split('/');
  return {name: name || 'projects', id: id ? decodeURIComponent(id) : null};
}
function setTop({title, back=false, menu=null, gear=false}){
  topbar.className = 'topbar' + (back ? ' has-back' : '');
  topbar.innerHTML = `<div class="topbar-in">
    ${back ? `<button class="icon-btn" id="tb-back" aria-label="Wstecz">${ic('back')}</button>` : ''}
    <h1>${esc(title)}</h1>
    ${gear ? `<a class="icon-btn" id="tb-settings" href="#/settings" aria-label="Ustawienia">${ic('gear')}</a>` : ''}
    ${menu ? `<button class="icon-btn" id="tb-menu" aria-label="Więcej opcji">${ic('more')}</button>` : ''}</div>`;
  if(back) $('#tb-back').onclick = back;
  if(menu) $('#tb-menu').onclick = menu;
}
function setFab(label, fnc){
  if(!label){ fab.hidden = true; fab.onclick = null; return; }
  fab.hidden = false; fab.innerHTML = ic('plus') + esc(label); fab.onclick = fnc;
}
function render(){
  const r = parseRoute();
  if(r.name==='calc' && r.id==='quotes'){ location.replace('#/quotes'); return; }   // stary adres
  const TAB_OF = {project:'projects', quote:'quotes', projects:'projects', quotes:'quotes', catalog:'catalog', calc:'calc'};
  if(TAB_OF[r.name]) lastTab = TAB_OF[r.name];
  $$('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === lastTab));
  switch(r.name){
    case 'project': viewProject(r.id); break;
    case 'quote': viewQuote(r.id); break;
    case 'quotes': viewQuotes(); break;
    case 'catalog': viewCatalog(); break;
    case 'settings': viewSettings(); break;
    case 'calc':
      if(r.id==='power') viewCalcPower();
      else if(r.id==='drop') viewCalcDrop();
      else if(r.id==='sep') viewSep();
      else viewCalcList();
      break;
    default: viewProjects();
  }
  prevRoute = r;
}
window.addEventListener('hashchange', () => { if(!sheetOpen) { render(); } });
/* Zakładki nie dokładają historii */
$$('.tab').forEach(t => t.addEventListener('click', e => {
  e.preventDefault();
  const target = t.getAttribute('href');
  if(location.hash === target){ render(); window.scrollTo(0,0); return; }
  location.replace(target);
  window.scrollTo(0,0);
}));
$$('[data-ic]').forEach(el => el.innerHTML = ic(el.dataset.ic));

/* ================= Widok: lista projektów ================= */
function viewProjects(){
  setTop({title:'Projekty', gear:true});
  setFab('Nowy projekt', () => projectForm());
  view.onclick = null;
  const counts = {all: db.projects.length};
  STATUSES.forEach(s => counts[s.k] = db.projects.filter(p=>p.status===s.k).length);
  const banner = !db.settings.configured ? `<a class="banner" href="#/settings">${ic('warn','style="width:22px;height:22px;flex:none;color:var(--warn)"')}<span><b>Ustaw stawki</b> – za kilometr i za godzinę pracy, zanim dodasz pierwsze pozycje.</span></a>` : '';
  view.innerHTML = `${banner}
    <div class="search">${ic('search')}<input id="q" type="search" placeholder="Szukaj: nazwa, adres, telefon" value="${esc(ui.q)}" enterkeyhint="search"></div>
    <div class="chips">${[{k:'all',l:'Wszystkie'}, ...STATUSES].map(s => `<button class="chip ${ui.status===s.k?'on':''}" data-status="${s.k}">${s.l}<span class="cnt">${counts[s.k]}</span></button>`).join('')}</div>
    <div id="plist"></div>`;
  $('#q').oninput = e => { ui.q = e.target.value; renderProjectList(); };
  $('.chips').onclick = e => { const b = e.target.closest('[data-status]'); if(b){ ui.status = b.dataset.status; viewProjects(); } };
  renderProjectList();
}
function renderProjectList(){
  const q = norm(ui.q.trim());
  let list = db.projects.filter(p => ui.status==='all' || p.status===ui.status);
  if(q) list = list.filter(p => norm([p.name, p.address, p.phone, p.notes].join(' ')).includes(q));
  list.sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||''));
  const el = $('#plist');
  if(!list.length){
    el.innerHTML = `<div class="empty">${ic('folder')}<p>${db.projects.length ? 'Brak projektów spełniających kryteria.' : 'Nie masz jeszcze żadnych projektów.<br>Dodaj pierwszy przyciskiem „Nowy projekt”.'}</p></div>`;
    return;
  }
  el.innerHTML = list.map(p => {
    const t = projectTotals(p);
    const sub = [p.address, p.distance!=null && p.distance!=='' ? `${fn(p.distance)} km` : ''].filter(Boolean).join(' · ');
    return `<a class="card pcard" href="#/project/${encodeURIComponent(p.id)}">
      <div class="pc-top"><div class="pc-name">${esc(p.name)}</div><div class="pc-sum">${fm(t.all)}</div></div>
      ${sub ? `<div class="pc-sub">${esc(sub)}</div>` : ''}
      <div class="pc-bot"><span class="badge s-${p.status}">${statusLabel(p.status)}</span><span class="muted">${p.items.length} poz. · ${fmtDate((p.updatedAt||'').slice(0,10))}</span></div></a>`;
  }).join('');
}

/* ================= Formularz projektu ================= */
function projectForm(p){
  const isNew = !p;
  const d = p || {name:'', address:'', phone:'', distance:null, status:'wycena'};
  openSheet(isNew ? 'Nowy projekt' : 'Edytuj projekt', `
    <div class="field"><label for="f-name">Nazwa projektu *</label><input class="inp" id="f-name" name="name" value="${esc(d.name)}" placeholder="np. Kowalski – rozdzielnia" enterkeyhint="next" autocapitalize="sentences"></div>
    <div class="field"><label for="f-address">Adres</label><input class="inp" id="f-address" name="address" value="${esc(d.address)}" placeholder="opcjonalnie" autocapitalize="words"></div>
    <div class="field"><label for="f-phone">Numer kontaktowy</label><input class="inp" id="f-phone" name="phone" type="tel" inputmode="tel" value="${esc(d.phone)}" placeholder="opcjonalnie"></div>
    ${fieldNum('distance', 'Odległość (w jedną stronę)', d.distance, 'km', {ph:'opcjonalnie', hint:'Przyjazd liczony jest tam i z powrotem (× 2).'})}
    <div class="field"><span class="flabel">Status</span><div class="seg" style="padding:0" data-seg>${STATUSES.map(s=>`<button type="button" class="s-${s.k} ${d.status===s.k?'on':''}" data-v="${s.k}">${s.l}</button>`).join('')}</div><input type="hidden" name="status" value="${d.status}"></div>
  `, {
    saveLabel: isNew ? 'Utwórz projekt' : 'Zapisz',
    onMount: form => {
      $('[data-seg]', form).onclick = e => {
        const b = e.target.closest('[data-v]'); if(!b) return;
        form.elements.status.value = b.dataset.v;
        $$('[data-v]', form).forEach(x => x.classList.toggle('on', x===b));
      };
      if(isNew) setTimeout(()=>form.elements.name.focus(), 250);
    },
    onSave: async form => {
      const name = form.elements.name.value.trim();
      if(!name) return markErr(form, 'name', 'Podaj nazwę projektu');
      const distRaw = form.elements.distance.value.trim();
      const distance = parseNum(distRaw);
      if(distRaw && (distance===null || distance<0)) return markErr(form, 'distance', 'Nieprawidłowa odległość');
      const data = {name, address: form.elements.address.value.trim(), phone: form.elements.phone.value.trim(), distance, status: form.elements.status.value};
      if(isNew){
        const now = new Date().toISOString();
        const np = {id: uid(), ...data, notes:'', items:[], createdAt: now, updatedAt: now};
        db.projects.push(np); save();
        return () => { location.hash = '/project/' + encodeURIComponent(np.id); };
      }
      const oldDist = p.distance;
      Object.assign(p, data); touch(p); save();
      const travels = p.items.filter(i => i.type==='travel' && i.km===oldDist);
      if(distance!=null && oldDist!==distance && travels.length){
        return async () => {
          render();
          if(await confirmDlg(`Zmieniono odległość na ${fn(distance)} km.\nZaktualizować też ${travels.length} ${travels.length===1?'przyjazd':'przyjazdy'} z ${fn(oldDist)} km?`, 'Aktualizuj', false)){
            travels.forEach(t => t.km = distance); touch(p); save(); render(); toast('Zaktualizowano przyjazdy');
          }
        };
      }
    }
  });
}

/* ================= Stan magazynowy ================= */
// Pozycja „część” w projekcie: cid – id części z katalogu, taken – ile sztuk odjęto ze stanu.
const stockUnits = q => Math.max(0, Math.ceil((Number(q)||0) - 1e-9));
const catByName = name => db.catalog.find(c => norm(c.name)===norm(String(name||'').trim())) || null;
const stockCat = it => (it.cid && db.catalog.find(c => c.id===it.cid)) || catByName(it.name);
function stockReturn(it){
  const n = it.taken>0 ? it.taken : 0, c = n ? stockCat(it) : null;
  if(c) c.stock = (c.stock||0) + n;
  it.taken = 0;
  return c ? n : 0;
}
// delta > 0: odejmij ze stanu (ile się da); delta < 0: oddaj nadmiar na stan
function stockAdjust(it, cat, delta){
  const taken = it.taken>0 ? it.taken : 0;
  it.cid = cat.id;
  if(delta > 0){
    const t = Math.min(cat.stock||0, delta);
    cat.stock = (cat.stock||0) - t; it.taken = taken + t;
    return {took: t, short: t ? delta - t : 0};
  }
  if(delta < 0){
    const target = Math.min(taken, stockUnits(it.qty)), back = taken - target;
    cat.stock = (cat.stock||0) + back; it.taken = target;
    return {back};
  }
  it.taken = taken;
  return {};
}
function stockTake(it){
  const cat = catByName(it.name);
  it.taken = 0;
  if(!cat){ delete it.cid; return {}; }
  return stockAdjust(it, cat, stockUnits(it.qty));
}
function stockMsg(r){
  return (r.took ? ` · ze stanu −${r.took} szt.` : '') + (r.back ? ` · na stan +${r.back} szt.` : '') + (r.short ? ` (brakło ${r.short} szt.)` : '');
}

function partSheet(p, it){
  const isNew = !it;
  const d = it || {name:'', price:null, qty:1};
  openSheet(isNew ? 'Nowa część' : 'Część', `
    <div class="field"><label for="f-name">Nazwa części</label>
      <input class="inp" id="f-name" name="name" value="${esc(d.name)}" placeholder="Wpisz lub wybierz z katalogu" autocapitalize="sentences" enterkeyhint="done">
      <div class="sugg" id="sugg"></div><div class="hint" id="stockhint" hidden></div></div>
    ${fieldNum('price', 'Cena za szt.', d.price, 'zł')}
    ${fieldStepper('qty', 'Ilość', d.qty, 1, [], '')}
    <label class="check" id="savecat" hidden><input type="checkbox" name="savecat" checked> Zapisz też w katalogu części</label>
    ${totalBox('pt')}
  `, {
    saveLabel: isNew ? 'Dodaj część' : 'Zapisz',
    onDelete: isNew ? null : deleteItemHandler(p, it),
    onMount: form => {
      const nameEl = form.elements.name, sugg = $('#sugg', form), saveCat = $('#savecat', form);
      let showSugg = isNew;
      const exact = () => db.catalog.find(c => norm(c.name)===norm(nameEl.value.trim()));
      const drawSugg = () => {
        if(!showSugg){ sugg.hidden = true; return; }
        sugg.hidden = false;
        if(!db.catalog.length){ sugg.innerHTML = '<div class="sugg-empty">Katalog jest pusty – wpisz własną część. Możesz ją od razu zapisać w katalogu.</div>'; return; }
        const q = norm(nameEl.value.trim());
        const list = db.catalog.filter(c => !q || norm(c.name).includes(q)).sort((a,b)=>a.name.localeCompare(b.name,'pl')).slice(0,50);
        sugg.innerHTML = list.length ? list.map(c => `<button type="button" data-cid="${c.id}"><span class="sg-name">${esc(c.name)}${stockSmall(c)}</span><span class="sg-price">${fm(c.price)}</span></button>`).join('')
          : '<div class="sugg-empty">Brak w katalogu – zostanie dodana jako własna część.</div>';
      };
      const upd = () => {
        const price = parseNum(form.elements.price.value)||0, qty = parseNum(form.elements.qty.value)||0;
        $('#pt', form).textContent = fm(price*qty);
        $('#pt-f', form).textContent = `${fn(qty)} × ${fm(price)}`;
        saveCat.hidden = !nameEl.value.trim() || !!exact();
        const c = exact(), hint = $('#stockhint', form);
        const mine = !isNew && it.taken>0 && c && stockCat(it) && stockCat(it).id===c.id ? it.taken : 0;
        const parts = [];
        if(c && c.stock>0) parts.push(`Na stanie: ${c.stock} szt.`);
        if(mine) parts.push(`pobrano do tej pozycji: ${mine} szt.`);
        hint.hidden = !parts.length; hint.textContent = parts.join(' · ');
      };
      nameEl.addEventListener('input', () => { showSugg = true; drawSugg(); });
      nameEl.addEventListener('focus', () => { showSugg = true; drawSugg(); });
      sugg.onclick = e => {
        const b = e.target.closest('[data-cid]'); if(!b) return;
        const c = db.catalog.find(x => x.id===b.dataset.cid); if(!c) return;
        nameEl.value = c.name; form.elements.price.value = inVal(c.price);
        showSugg = false; drawSugg(); upd();
        if(document.activeElement) document.activeElement.blur();
      };
      bindSteppers(form, upd); drawSugg(); upd();
    },
    onSave: form => {
      const name = form.elements.name.value.trim();
      const price = parseNum(form.elements.price.value), qty = parseNum(form.elements.qty.value);
      if(!name) return markErr(form, 'name', 'Podaj nazwę części');
      if(price===null || price<0) return markErr(form, 'price', 'Podaj cenę');
      if(qty===null || qty<=0) return markErr(form, 'qty', 'Podaj ilość');
      const data = {type:'part', name, price, qty};
      const inCat = db.catalog.find(c => norm(c.name)===norm(name));
      if(!inCat && form.elements.savecat.checked){ db.catalog.push({id: uid(), name, price, stock:0}); }
      let st;
      if(isNew){ const item = {id: uid(), ...data}; p.items.push(item); st = stockTake(item); }
      else {
        const prev = stockCat(it), oldQty = it.qty, cat = catByName(name);
        if(prev && cat && prev.id===cat.id){ Object.assign(it, data); st = stockAdjust(it, cat, stockUnits(qty) - stockUnits(oldQty)); }
        else { const back = stockReturn(it); Object.assign(it, data); st = stockTake(it); st.back = back; }
      }
      touch(p); save();
      toast((isNew ? 'Dodano część' : 'Zapisano') + (!inCat && form.elements.savecat.checked ? ' (+ katalog)' : '') + stockMsg(st));
    }
  });
}

function renderCatalogList(){
  const q = norm(ui.catQ.trim());
  const found = db.catalog.filter(c => !q || norm(c.name).includes(q));
  const CF = [{k:'all', l:'Wszystkie', f:() => true}, {k:'in', l:'Na stanie', f:c => c.stock>0}, {k:'out', l:'Bez stanu', f:c => !(c.stock>0)}];
  const cf = CF.find(x => x.k===ui.catF) || CF[0];
  const chips = $('#cchips');
  chips.hidden = !db.catalog.length;
  chips.innerHTML = CF.map(x => `<button class="chip ${x===cf?'on':''}" data-cf="${x.k}">${x.l}<span class="cnt">${found.filter(x.f).length}</span></button>`).join('');
  const list = found.filter(cf.f).sort((a,b)=>a.name.localeCompare(b.name,'pl'));
  const el = $('#clist');
  if(!list.length){
    const none = q ? 'Nic nie znaleziono.' : (cf.k==='in' ? 'Żadna część nie jest na stanie.' : 'Wszystkie części są na stanie.');
    el.innerHTML = `<div class="empty">${ic('box')}<p>${db.catalog.length ? none : 'Katalog jest pusty.<br>Dodaj części, których często używasz,<br>albo zaimportuj listę z pliku (menu ⋮ u góry).'}</p></div>`;

function parseCsvRows(text){
  const first = text.split(/\r?\n/).find(l => l.trim()) || '';
  const delim = first.includes(';') ? ';' : (first.includes('\t') ? '\t' : ',');
  const rows = []; let row = [], f = '', inQ = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else inQ = false; }
      else f += ch;
    } else if(ch==='"' && f==='') inQ = true;
    else if(ch===delim){ row.push(f); f=''; }
    else if(ch==='\n' || ch==='\r'){
      if(ch==='\r' && text[i+1]==='\n') i++;
      row.push(f); rows.push(row); row=[]; f='';
    } else f += ch;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim()!==''));
}
function parsePrice(v){
  let s = String(v ?? '').replace(/zł|pln/gi,'').replace(/\s/g,'');
  if(s.includes('.') && s.includes(',')) s = s.replace(/\./g,'');
  return parseNum(s);
}
/* Zwraca {items:[{name,price,stock?}], skipped} – stock undefined = brak kolumny/wartości */
function parseCatalogFile(text){
  text = text.replace(/^﻿/, '');
  const t = text.trim();
  let raw = [], skipped = 0;
  if(t.startsWith('{') || t.startsWith('[')){
    const data = JSON.parse(t);
    const arr = Array.isArray(data) ? data : (Array.isArray(data.catalog) ? data.catalog : null);
    if(!arr) throw new Error('format');
    arr.forEach(c => {
      const name = String(c && (c.name ?? c.nazwa) || '').trim(), price = parsePrice(c && (c.price ?? c.cena));
      const stock = toStock(c && (c.stock ?? c.stan));
      if(name && price!==null && price>=0) raw.push({name, price, stock}); else skipped++;
    });
  } else {
    const rows = parseCsvRows(text);
    const nCols = (rows[0]||[]).some(c => norm(String(c).trim())==='stan') ? 3 : 2;
    rows.forEach((r, idx) => {
      const name = String(r[0]||'').trim();
      let pr = r[1], rest = r.slice(2);
      // CSV z przecinkiem jako separatorem i ceną "3,20" bez cudzysłowu
      if(r.length===nCols+1 && /^\d+$/.test(String(r[1]).trim()) && /^\d{1,2}$/.test(String(r[2]).trim())){ pr = r[1]+','+r[2]; rest = r.slice(3); }
      const price = parsePrice(pr), stock = toStock(rest[0]);
      if(name && price!==null && price>=0) raw.push({name, price, stock});
      else if(idx>0) skipped++;     // pierwszy wiersz to zwykle nagłówek
    });
  }
  const map = new Map();             // duplikaty w pliku: ostatni wygrywa
  raw.forEach(it => map.set(norm(it.name), {name: it.name, price: r2(it.price), stock: it.stock}));
  return {items: [...map.values()], skipped};
}
function importCatalogFromFile(){
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.csv,.json,.txt,text/csv,text/comma-separated-values,text/plain,application/json';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    let parsed;
    try{ parsed = parseCatalogFile(await f.text()); }
    catch(err){ console.error(err); toast('Nie udało się odczytać pliku'); return; }
    const {items, skipped} = parsed;
    if(!items.length){ toast('W pliku nie znaleziono żadnych części'); return; }
    let nNew = 0, nChanged = 0, nSame = 0;
    items.forEach(it => {
      const ex = db.catalog.find(c => norm(c.name)===norm(it.name));
      if(!ex) nNew++; else if(r2(ex.price)!==it.price || (it.stock!==undefined && it.stock!==(ex.stock||0))) nChanged++; else nSame++;
    });
    const info = `W pliku: ${items.length} ${plural(items.length,'część','części','części')}` + (skipped ? ` (pominięto ${skipped} ${plural(skipped,'błędny wiersz','błędne wiersze','błędnych wierszy')})` : '') + '.';
    let mode;
    if(!db.catalog.length){
      mode = await choiceDlg(`${info}\nWczytać je do katalogu?`, [{k:'merge', l:'Wczytaj', cls:'primary'}, {k:null, l:'Anuluj'}]);
    } else {
      mode = await choiceDlg(`${info}\n\n• nowe: ${nNew}\n• ze zmienioną ceną lub stanem: ${nChanged}\n• bez zmian: ${nSame}\n\nObecnie w katalogu: ${db.catalog.length}.`, [
        {k:'merge', l:`Dodaj nowe i zaktualizuj ceny/stany`, cls:'primary'},
        {k:'replace', l:'Zastąp cały katalog', cls:'danger-ghost'},
        {k:null, l:'Anuluj'}
      ]);
    }
    if(!mode) return;
    if(mode==='replace'){
      if(!await confirmDlg(`Usunąć obecne ${db.catalog.length} części z katalogu i wczytać ${items.length} z pliku?\nCzęści dodane już do projektów pozostaną bez zmian.`, 'Zastąp')) return;
      db.catalog = items.map(it => ({id: uid(), ...it, stock: it.stock ?? 0}));
      save(); render(); toast(`Katalog zastąpiony: ${items.length} części`);
      return;
    }
    items.forEach(it => {
      const ex = db.catalog.find(c => norm(c.name)===norm(it.name));
      if(!ex) db.catalog.push({id: uid(), ...it, stock: it.stock ?? 0});
      else { ex.price = it.price; if(it.stock!==undefined) ex.stock = it.stock; }
    });
    save(); render(); toast(`Dodano ${nNew}, zaktualizowano ${nChanged}`);
  };
  inp.click();
}

function quoteItemsFromProject(p, mode){
  const out = [];
  const tr = itemsOf(p,'travel'), lb = itemsOf(p,'labor'), pt = itemsOf(p,'part');
  const same = (arr, k) => arr.length && arr.every(x => Number(x[k])===Number(arr[0][k]));
  if(mode==='detail'){
    tr.forEach(t => out.push({name:`Dojazd${t.date ? ' ' + fmtDate(t.date) : ''} (${fn(t.km)} km × 2)`, qty:r2(t.km*2), unit:'km', price:Number(t.rate)||0}));
    lb.forEach(l => out.push({name:`Robocizna ${fmtDate(l.date)}${l.desc ? ' – ' + l.desc : ''}`, qty:Number(l.hours)||0, unit:'h', price:Number(l.rate)||0}));
    pt.forEach(x => out.push({name:x.name, qty:Number(x.qty)||0, unit:'szt.', price:Number(x.price)||0}));
  } else {
    if(tr.length){
      const tot = r2(tr.reduce((s,t)=>s+itemTotal(t),0));
      const name = `Dojazd (${tr.length} ${plural(tr.length,'przyjazd','przyjazdy','przyjazdów')})`;
      out.push(same(tr,'rate') ? {name, qty:r2(tr.reduce((s,t)=>s+t.km*2,0)), unit:'km', price:Number(tr[0].rate)||0} : {name, qty:1, unit:'kpl.', price:tot});
    }
    if(lb.length){
      const tot = r2(lb.reduce((s,l)=>s+itemTotal(l),0));
      out.push(same(lb,'rate') ? {name:'Robocizna', qty:r2(lb.reduce((s,l)=>s+Number(l.hours),0)), unit:'h', price:Number(lb[0].rate)||0} : {name:'Robocizna', qty:1, unit:'kpl.', price:tot});
    }
    if(pt.length){
      out.push({name:'Materiały', qty:1, unit:'kpl.', price:r2(pt.reduce((s,x)=>s+itemTotal(x),0))});
    }
  }
  return out.map(it => ({id: uid(), ...it}));
}

function quoteDocData(q){
  const c = db.company;
  const seller = [];
  if(c.name) seller.push(c.name);
  if(c.person) seller.push(c.person);
  if(c.address) c.address.split(/\r?\n/).forEach(l => l.trim() && seller.push(l.trim()));
  if(c.nip) seller.push('NIP: ' + c.nip);
  if(c.phone) seller.push('tel. ' + c.phone);
  if(c.email) seller.push('e-mail: ' + c.email);
  if(c.bank) seller.push('Nr konta: ' + c.bank);
  const buyer = [];
  if(q.client.name) buyer.push(q.client.name);
  if(q.client.address) buyer.push(q.client.address);
  if(q.client.phone) buyer.push('tel. ' + q.client.phone);
  return {
    title: `Wycena nr ${q.number}`, date: fmtDate(q.date), seller, buyer, subject: q.subject.trim(),
    rows: q.items.map((it, i) => [String(i+1), it.name, docNum(it.qty), it.unit, docMoney(it.price), docMoney(r2(it.qty*it.price))]),
    total: docMoney(quoteTotal(q)), notes: (q.notes||'').trim()
  };
}
const quoteFileBase = q => {
  const base = 'Wycena_' + q.number.replace(/[\\/:*?"<>|\s]+/g, '-');
  const subj = String(q.subject || '').replace(/[\\/:*?"<>|\u0000-\u001F]+/g, ' ').trim().replace(/\s+/g, '_').replace(/_?[–—-]_?/g, '-').replace(/^[._-]+|[._-]+$/g, '');
  let cut = subj.length > 60 ? subj.slice(0, 60).replace(/_[^_]*$/, '') : subj;
  cut = cut.replace(/[._-]+$/, '');
  return cut ? cut + '_' + base : base;
};

let pdfLibsP = null;
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Nie udało się wczytać ' + src)); document.head.appendChild(s); });
}
function loadPdfLibs(){
  if(!pdfLibsP){
    pdfLibsP = loadScript('libs/jspdf.umd.min.js')
      .then(() => loadScript('libs/jspdf.plugin.autotable.min.js'))
      .then(() => loadScript('libs/fonts.js'))
      .catch(err => { pdfLibsP = null; throw err; });

}
async function buildQuotePdf(q){
  await loadPdfLibs();
  const D = quoteDocData(q);
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  doc.addFileToVFS('ElfSans-Regular.ttf', window.ELF_FONTS.regular); doc.addFont('ElfSans-Regular.ttf', 'ElfSans', 'normal');
  doc.addFileToVFS('ElfSans-Bold.ttf', window.ELF_FONTS.bold); doc.addFont('ElfSans-Bold.ttf', 'ElfSans', 'bold');
  doc.setProperties({title: D.title, creator: 'el_Fuszka'});
  const M = 15, PW = 210, PH = 297, CW = PW - 2*M;
  let y = 20;
  doc.setTextColor(17, 24, 39);
  doc.setFont('ElfSans', 'bold'); doc.setFontSize(18); doc.text(D.title, M, y);
  doc.setFont('ElfSans', 'normal'); doc.setFontSize(10); doc.text('Data: ' + D.date, PW - M, y, {align:'right'});
  y += 4; doc.setDrawColor(29, 78, 216); doc.setLineWidth(0.6); doc.line(M, y, PW - M, y);
  y += 8;
  const colW = (CW - 10) / 2;
  const block = (x, label, lines) => {
    let yy = y;
    doc.setFont('ElfSans', 'bold'); doc.setFontSize(8.5); doc.setTextColor(107, 114, 128); doc.text(label.toUpperCase(), x, yy);
    yy += 5; doc.setTextColor(17, 24, 39); doc.setFontSize(10);
    if(!lines.length){ doc.setFont('ElfSans', 'normal'); doc.text('—', x, yy); return yy + 4.6; }
    lines.forEach((ln, i) => {
      doc.setFont('ElfSans', i===0 ? 'bold' : 'normal');
      const parts = doc.splitTextToSize(ln, colW);
      doc.text(parts, x, yy); yy += parts.length * 4.6;
    });
    return yy;
  };
  y = Math.max(block(M, 'Wykonawca', D.seller), block(M + colW + 10, 'Zamawiający', D.buyer)) + 3;
  if(D.subject){
    doc.setFontSize(10); doc.setFont('ElfSans', 'bold'); doc.text('Dotyczy:', M, y);
    doc.setFont('ElfSans', 'normal');
    const parts = doc.splitTextToSize(D.subject, CW - 18); doc.text(parts, M + 17, y); y += parts.length * 4.6;
  }
  y += 3;
  const opts = {
    startY: y, margin: {left: M, right: M, bottom: 18},
    head: [['Lp.', 'Nazwa', 'Ilość', 'j.m.', 'Cena jedn.', 'Wartość']],
    body: D.rows.length ? D.rows : [['', 'Brak pozycji', '', '', '', '']],
    foot: [[{content:'Razem', colSpan:5, styles:{halign:'right'}}, {content:D.total, styles:{halign:'right'}}]],
    showFoot: 'lastPage',
    styles: {font:'ElfSans', fontSize:9.5, cellPadding:2, textColor:[17,24,39], lineColor:[200,205,215], lineWidth:0.2, valign:'middle'},
    headStyles: {font:'ElfSans', fontStyle:'bold', fillColor:[29,78,216], textColor:255, halign:'center'},
    footStyles: {font:'ElfSans', fontStyle:'bold', fillColor:[230,237,255], textColor:[17,24,39], fontSize:11},
    columnStyles: {0:{halign:'center', cellWidth:10}, 1:{cellWidth:'auto'}, 2:{halign:'right', cellWidth:17}, 3:{halign:'center', cellWidth:13}, 4:{halign:'right', cellWidth:27}, 5:{halign:'right', cellWidth:29}}
  };
  if(typeof doc.autoTable === 'function') doc.autoTable(opts);
  else window.jspdf_autotable.autoTable(doc, opts);
  y = doc.lastAutoTable.finalY + 9;
  if(D.notes){
    const parts = doc.splitTextToSize(D.notes, CW);
    if(y + 10 > PH - 18){ doc.addPage(); y = 20; }
    doc.setFont('ElfSans', 'bold'); doc.setFontSize(10.5); doc.text('Uwagi', M, y); y += 5.5;
    doc.setFont('ElfSans', 'normal'); doc.setFontSize(10);
    parts.forEach(line => { if(y > PH - 18){ doc.addPage(); y = 20; } doc.text(line, M, y); y += 4.8; });
  }
  const n = doc.getNumberOfPages();
  for(let i = 1; i <= n; i++){
    doc.setPage(i); doc.setFont('ElfSans', 'normal'); doc.setFontSize(8); doc.setTextColor(140);
    doc.text(`${D.title}${n > 1 ? `  ·  strona ${i} z ${n}` : ''}`, PW - M, PH - 10, {align:'right'});
  }
  return doc.output('blob');
}

/* ----- DOCX (własny zapis Office Open XML + ZIP) ----- */
const CRC_TABLE = (() => { const t = new Uint32Array(256); for(let n=0; n<256; n++){ let c = n; for(let k=0; k<8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for(let i=0; i<u8.length; i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files){
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosDate = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, dosTime, true); lh.setUint16(12, dosDate, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true); lh.setUint32(22, data.length, true); lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, dosTime, true); ch.setUint16(14, dosDate, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true); ch.setUint32(24, data.length, true); ch.setUint16(28, name.length, true);
    ch.setUint16(30, 0, true); ch.setUint16(32, 0, true); ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + data.length;
  });
  const cdSize = central.reduce((s, a) => s + a.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);

}

/* ----- Generowanie i udostępnianie ----- */
async function generateQuoteFile(q, kind){
  if(!q.items.length && !await confirmDlg('Wycena nie ma żadnych pozycji. Wygenerować mimo to?', 'Generuj', false)) return;
  clearTimeout(quoteSaveT); touch(q); save();
  let blob;
  const name = quoteFileBase(q) + (kind==='pdf' ? '.pdf' : '.docx');
  try{
    toast('Generuję plik…');
    blob = kind==='pdf' ? await buildQuotePdf(q) : buildQuoteDocx(q);
  }catch(err){
    console.error(err);
    toast(kind==='pdf' ? 'Nie udało się utworzyć PDF – sprawdź połączenie przy pierwszym użyciu' : 'Nie udało się utworzyć pliku');
    return;
  }
  const type = kind==='pdf' ? 'application/pdf' : 'application/vnd.openxmlformats-officedocument.wordprocessingml.document';
  const file = new File([blob], name, {type});
  let share = false;
  try{ share = !!(navigator.canShare && navigator.canShare({files:[file]})); }catch(e){}
  openSheet('Plik gotowy', `<div class="choose">
    <div class="recom" style="margin:0 0 4px"><span class="grow"><b>${esc(name)}</b><br><span class="small muted">${Math.max(1, Math.round(blob.size/1024))} kB · ${q.items.length} poz. · ${fm(quoteTotal(q))}</span></span></div>
    ${share ? `<button type="button" data-a="share"><span class="ci">${ic('share')}</span><span><b>Udostępnij</b><small>WhatsApp, e-mail, Messenger, Dysk…</small></span></button>` : ''}
    <button type="button" data-a="download"><span class="ci">${ic('download')}</span><span><b>Zapisz w telefonie</b><small>Folder „Pobrane”</small></span></button>
  </div>`, {
    onMount: form => {
      form.onclick = e => {
        const b = e.target.closest('[data-a]'); if(!b) return;
        if(b.dataset.a==='share'){
          navigator.share({files:[file], title: q.number}).then(() => closeSheet()).catch(err => { if(err && err.name!=='AbortError') toast('Nie udało się udostępnić'); });
        } else {
          downloadBlob(blob, name); toast('Zapisano w Pobranych'); closeSheet();
        }
      };
    }
  });
}

/* ----- Spadek napięcia i prąd w przewodzie ----- */
function dropCompute(st, S){
  const sys = st.U<=24 ? 'dc' : (st.U===230 ? '1f' : '3f');
  const cos = sys==='dc' ? 1 : st.cos;
  const out = {sys, cos, P:null, I:null};
  if(!(cos>0 && cos<=1)) { out.cosErr = true; return out; }
  const k = (sys==='3f' ? SQ3 : 1) * st.U * cos;
  if(st.src==='P'){ out.P = st.P; out.I = (st.P!=null && st.P>=0) ? st.P*1000/k : null; }
  else { out.I = st.I; out.P = (st.I!=null && st.I>=0) ? k*st.I/1000 : null; }
  out.Iz = (IZ[st.mat][sys==='3f' ? 3 : 2] || {})[S] ?? null;
  if(out.I==null || !(st.L>0) || !(S>0)) return out;
  const R = st.L / (GAMMA[st.mat] * S);                // rezystancja jednej żyły [Ω]
  out.R = R;
  out.dU = (sys==='3f' ? SQ3 : 2) * out.I * R * cos;     // spadek napięcia [V]
  out.dUp = out.dU / st.U * 100;                          // [%]
  out.loss = (sys==='3f' ? 3 : 2) * out.I * out.I * R;    // straty mocy [W]
  out.Uend = st.U - out.dU;
  return out;
}

      <div><code>ΔU% = ΔU / U · 100</code>, dopuszczalny spadek: ${DROP_LIMIT}%</div>
      <div style="margin-top:6px"><b>Straty mocy:</b> <code>ΔP = n · I² · L / (γ · S)</code>, n = 3 (3-faz.) lub 2</div>
      <div style="margin-top:6px">L – długość trasy (w jedną stronę), S – przekrój, γ – konduktywność: Cu 56, Al 34 m/(Ω·mm²). Pominięto reaktancję przewodu (dokładne dla przekrojów do ok. 50 mm²).</div>
      <div style="margin-top:6px"><b>Obciążalność Iz</b> – orientacyjnie wg PN-HD 60364-5-52, metoda C (przewód na ścianie), izolacja PVC 70°C, otoczenie 30°C, 2 obciążone żyły (DC, 1-faz.) lub 3 (3-faz.). Dla innych warunków ułożenia stosuj współczynniki poprawkowe.</div>
    </div></details>`;

  const upd = () => {
    const r = dropCompute(st, st.S);
    $('#cos-wrap').hidden = r.sys==='dc';
    showPI(st, r.P, r.I);
    const res = $('#res');
    saveCalc();
    if(r.cosErr){ res.innerHTML = `<div class="set-row" style="color:var(--danger)">cos φ musi być w zakresie 0–1.</div>`; return; }
    if(r.I==null){ res.innerHTML = `<div class="set-row muted">Wpisz moc [kW] albo prąd [A].</div>`; return; }
    if(r.dU==null){ res.innerHTML = `<div class="res-head">Wynik</div><div class="res-big" style="padding-bottom:12px"><span>Prąd I</span><b>${f2(r.I)} A</b></div><div class="set-row muted">Wpisz długość trasy, aby policzyć spadek napięcia.</div>`; return; }
    const okDU = r.dUp <= DROP_LIMIT;
    const okIz = r.Iz==null ? null : r.I <= r.Iz;
    // Najmniejszy przekrój spełniający oba warunki
    let rec = null;
    for(const S of SECTIONS){
      const x = dropCompute(st, S);
      if(x.Iz==null) continue;
      if(x.dUp <= DROP_LIMIT && x.I <= x.Iz){ rec = {S, dUp:x.dUp, Iz:x.Iz}; break; }
    }
    const sysTxt = r.sys==='dc' ? 'DC' : (r.sys==='1f' ? '1-fazowy' : '3-fazowy');
    res.innerHTML = `<div class="res-head">Wynik · układ ${sysTxt}</div>
      <div class="res-big ${okIz===null?'':(okIz?'ok':'bad')}"><span>Obciążalność Iz<small class="muted" style="display:block;font-size:12px">orientacyjnie, metoda C</small></span><b>${r.Iz==null ? '—' : fn(r.Iz) + ' A'}</b></div>
      <div style="padding:6px 16px 12px"><span class="pill ${okDU?'ok':'bad'}">${okDU ? `✓ spadek ≤ ${DROP_LIMIT}% OK` : `✗ spadek > ${DROP_LIMIT}%`}</span>
        ${okIz===null ? '' : ` <span class="pill ${okIz?'ok':'bad'}">${okIz ? '✓ obciążalność OK' : '✗ przekroczona obciążalność'}</span>`}</div>
      ${kv('Spadek napięcia ΔU', f2(r.dUp) + ' % · ' + f2(r.dU) + ' V')}
      ${kv('Napięcie na końcu przewodu', f2(r.Uend) + ' V')}
      ${kv('Prąd I', f2(r.I) + ' A')}
      ${kv('Moc P', f3(r.P) + ' kW')}
      ${kv('Rezystancja żyły R', new Intl.NumberFormat('pl-PL',{maximumFractionDigits:4}).format(r.R) + ' Ω')}
      ${kv('Straty mocy w przewodzie', f2(r.loss) + ' W')}
      <div style="height:12px"></div>
      ${rec ? (rec.S===st.S ? `<div class="recom"><span class="grow">Wybrany przekrój jest najmniejszym spełniającym oba warunki.</span></div>`
          : `<div class="recom"><span class="grow">Najmniejszy przekrój spełniający warunki: <b>${String(rec.S).replace('.',',')} mm²</b><br><span class="small muted">ΔU ${f2(rec.dUp)} %, Iz ${fn(rec.Iz)} A</span></span><button type="button" class="btn primary" id="apply-rec">Ustaw</button></div>`)
        : `<div class="recom"><span class="grow">Żaden przekrój do 300 mm² nie spełnia warunków – skróć trasę lub podziel obwód.</span></div>`}`;
    const ab = $('#apply-rec');
    if(ab) ab.onclick = () => { st.S = rec.S; $('#c-S').value = String(rec.S); upd(); };
  };
  bindSeg('U', v => { st.U = Number(v); upd(); });
  bindSeg('mat', v => { st.mat = v; upd(); });
  bindCos(st, upd);
  bindPI(st, upd);
  $('#c-S').onchange = e => { st.S = Number(e.target.value); upd(); };
  $('#c-L').oninput = e => { st.L = parseNum(e.target.value); upd(); };
  upd();
}

/* ================= Widok: ustawienia ================= */
function viewSettings(){
  const cameIn = !!(prevRoute && prevRoute.name!=='settings');
  if(cameIn) history.replaceState({fromParent:true}, '');
  setTop({title:'Ustawienia', back: () => { if(cameIn || history.state?.fromParent) history.back(); else location.replace('#/projects'); }});
  setFab(null);
  view.onclick = null;
  const s = db.settings;
  let canShare = false;
  try{ canShare = !!(navigator.canShare && window.File && navigator.canShare({files:[new File(['{}'], 'a.json', {type:'application/json'})]})); }catch(e){}
  const lb = db.meta.lastBackup;
  view.innerHTML = `
    <div class="sec-title">Stawki</div>
    <section class="card"><form id="rates" class="card-pad" novalidate>
      ${fieldNum('kmRate', 'Stawka za kilometr', s.configured ? s.kmRate : null, 'zł/km', {hint:'Przyjazd = odległość × 2 × stawka za km'})}
      ${fieldNum('hourRate', 'Stawka godzinowa', s.configured ? s.hourRate : null, 'zł/h', {hint:'Robocizna = czas pracy × stawka godzinowa'})}
      <button class="btn primary block" type="submit">Zapisz stawki</button>
      <div class="hint">Nowe stawki dotyczą nowych pozycji. Istniejące projekty możesz przeliczyć z menu projektu (⋮).</div>
    </form></section>

    <div class="sec-title">Dane wykonawcy (do wycen)</div>
    <section class="card"><form id="company" class="card-pad" novalidate>
      <div class="hint" style="margin:0 0 12px">Na wycenie pojawią się tylko wypełnione pola.</div>
      <div class="field"><label for="co-name">Nazwa firmy</label><input class="inp" id="co-name" name="name" value="${esc(db.company.name)}" placeholder="opcjonalnie"></div>
      <div class="field"><label for="co-person">Imię i nazwisko</label><input class="inp" id="co-person" name="person" value="${esc(db.company.person)}" autocapitalize="words"></div>
      <div class="field"><label for="co-nip">NIP</label><input class="inp" id="co-nip" name="nip" inputmode="numeric" value="${esc(db.company.nip)}" placeholder="opcjonalnie"></div>
      <div class="field"><label for="co-address">Adres</label><textarea class="inp" id="co-address" name="address" rows="2" placeholder="ulica, kod i miejscowość">${esc(db.company.address)}</textarea></div>
      <div class="field"><label for="co-phone">Telefon</label><input class="inp" id="co-phone" name="phone" type="tel" inputmode="tel" value="${esc(db.company.phone)}"></div>
      <div class="field"><label for="co-email">E-mail</label><input class="inp" id="co-email" name="email" type="email" inputmode="email" value="${esc(db.company.email)}" autocapitalize="off"></div>
      <div class="field"><label for="co-bank">Nr konta</label><input class="inp" id="co-bank" name="bank" inputmode="numeric" value="${esc(db.company.bank)}" placeholder="opcjonalnie"></div>
      <div class="field"><label for="co-notes">Domyślne uwagi na nowych wycenach</label><textarea class="inp" id="co-notes" name="notes" rows="3" placeholder="np. Oferta ważna 14 dni. Gwarancja 24 miesiące.">${esc(db.company.notes)}</textarea></div>
      <button class="btn primary block" type="submit">Zapisz dane wykonawcy</button>
    </form></section>

    <div class="sec-title">Kopia zapasowa</div>
    <section class="card">
      <div class="kv"><span>Ostatnia kopia</span><b>${lb ? fmtDate(lb.slice(0,10)) : 'nigdy'}</b></div>
      <div class="set-row small muted">Dane są zapisane tylko w tym telefonie. Rób regularnie kopię i trzymaj ją np. na Dysku Google – przyda się przy zmianie telefonu lub wyczyszczeniu przeglądarki.</div>
      <div class="btns" style="padding-top:4px">
        ${canShare ? `<button class="btn primary" id="b-share">${ic('share')}Udostępnij kopię (np. na Dysk)</button>` : ''}
        <button class="btn ${canShare?'ghost':'primary'}" id="b-export">${ic('download')}Zapisz kopię do pliku</button>
        <button class="btn ghost" id="b-import">${ic('upload')}Wczytaj kopię z pliku</button>
        <input type="file" id="f-import" accept=".json,application/json" hidden>
      </div>
    </section>

    <div class="sec-title">Informacje</div>
    <section class="card">
      <div class="kv"><span>Projekty</span><b>${db.projects.length}</b></div>
      <div class="kv"><span>Części w katalogu</span><b>${db.catalog.length}</b></div>
      <div class="kv"><span>Uprawnienia SEP</span><b>${db.sep.length}</b></div>
      <div class="kv"><span>Wyceny</span><b>${db.quotes.length}</b></div>
      <div class="kv"><span>Trwały zapis danych</span><b id="persist">…</b></div>
      <div class="kv"><span>Wersja aplikacji</span><b>${APP_VERSION}</b></div>
    </section>`;

  $('#company').onsubmit = e => {
    e.preventDefault();
    const f = e.target, c = {};
    ['name','person','nip','address','phone','email','bank','notes'].forEach(k => c[k] = f.elements[k].value.trim());
    db.company = {...db.company, ...c}; save();
    document.activeElement && document.activeElement.blur();
    toast('Zapisano dane wykonawcy');
  };
  $('#rates').onsubmit = e => {
    e.preventDefault();
    const form = e.target;
    const km = parseNum(form.elements.kmRate.value), hr = parseNum(form.elements.hourRate.value);
    if(km===null || km<0) return markErr(form, 'kmRate', 'Podaj stawkę za km');
    if(hr===null || hr<0) return markErr(form, 'hourRate', 'Podaj stawkę godzinową');
    db.settings = {...db.settings, kmRate: km, hourRate: hr, configured: true}; save();
    document.activeElement && document.activeElement.blur();
    toast('Zapisano stawki');
  };
  const fileName = () => `el_fuszka-kopia-${todayISO()}.json`;
  const backupBlob = () => new Blob([JSON.stringify({...db, exportedAt: new Date().toISOString(), app:'el_fuszka'}, null, 2)], {type:'application/json'});
  const markBackup = () => { db.meta.lastBackup = new Date().toISOString(); save(); viewSettings(); };
  $('#b-export').onclick = () => {
    const url = URL.createObjectURL(backupBlob());
    const a = document.createElement('a'); a.href = url; a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    markBackup(); toast('Kopia zapisana w Pobranych');
  };
  if(canShare) $('#b-share').onclick = async () => {
    try{
      await navigator.share({files:[new File([backupBlob()], fileName(), {type:'application/json'})], title:'Kopia – el_Fuszka'});
      markBackup(); toast('Kopia udostępniona');
    }catch(err){ if(err && err.name!=='AbortError') toast('Nie udało się udostępnić'); }
  };
  $('#b-import').onclick = () => $('#f-import').click();
  $('#f-import').onchange = async e => {
    const f = e.target.files[0]; e.target.value = '';
    if(!f) return;
    try{
      const data = JSON.parse(await f.text());
      if(!data || !Array.isArray(data.projects) || !Array.isArray(data.catalog)) throw new Error('format');
      const n = normalize(data);
      if(!await confirmDlg(`Wczytać kopię z pliku?\n\nW pliku: ${n.projects.length} projektów, ${n.catalog.length} części w katalogu.\nObecne dane w telefonie (${db.projects.length} projektów) zostaną ZASTĄPIONE.`, 'Wczytaj', true)) return;
      db = n; save(); viewSettings(); toast('Wczytano kopię');
    }catch(err){ console.error(err); toast('To nie jest prawidłowy plik kopii'); }
  };
  const pe = $('#persist');
  if(navigator.storage && navigator.storage.persisted){
    navigator.storage.persisted().then(v => { pe.textContent = v ? 'tak' : 'nie (zainstaluj aplikację)'; }).catch(()=>pe.textContent='—');
  } else pe.textContent = '—';
}

/* ================= Start ================= */
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW', err)));
}
render();
</script>
</body>
</html>
